name: publish

# Publishes the package to PyPI when a GitHub release is published. The release tag must be the
# version in pyproject.toml, with or without a leading "v" (e.g. "0.1.0" or "v0.1.0").
# Uses PyPI trusted publishing: no password or API token is stored anywhere. One-time setup on
# pypi.org, see "Releasing" in the README.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match the package version ${version} (expected tag ${version} or v${version})"
            exit 1
          fi
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test of the built wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          xPDFsim -o --no-plot -p G_r "${GITHUB_WORKSPACE}/xPDFsim/static/examples/9015662.cif"
          xPDFsim -o --no-plot -p GK_r --radiation neutron "${GITHUB_WORKSPACE}/xPDFsim/static/examples/4002052.cif"
          test -s 9015662_G_r.csv && test -s 4002052_GK_r_neutron.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # the environment must match the trusted publisher configured on pypi.org
    environment:
      name: pypi
      url: https://pypi.org/project/xPDFsim/
    permissions:
      id-token: write          # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
