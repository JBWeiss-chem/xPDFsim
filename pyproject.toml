[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xPDFsim"
version = "0.0.3"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "xPDFsim/static/vendor/three/LICENSE"]
description = "Simulation of X-ray and neutron pair distribution functions from CIF files, with a browser GUI."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["PDF", "pair distribution function", "total scattering", "disordered materials", "simulation", "crystallography", "X-ray", "neutron"]
authors = [
    { name = "Jan-Benedikt Weiß" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
	'Operating System :: OS Independent',     
]

dependencies = [
    "numpy"
    ]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# the web front end of the GUI, including the bundled three.js
xPDFsim = ["static/**/*"]

[project.scripts]
xPDFsim = "xPDFsim.main:cli"
xPDFsim-gui = "xPDFsim.server:main"

[project.urls]
Repository = "https://github.com/JBWeiss-chem/xPDFsim"
Documentation = "https://xpdfsim.readthedocs.io"